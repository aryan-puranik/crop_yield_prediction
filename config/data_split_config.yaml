# Chronological Data Split Strategy Configuration
# Strict separation to prevent temporal data leakage

strategy: "chronological"

partitions:
  train:
    start_year: 1966
    end_year: 2011
    description: "Historical training observations (46 years, 176,196 records, 88.82%)"
  validation:
    start_year: 2012
    end_year: 2014
    description: "Model selection and hyperparameter tuning (3 years, 11,345 records, 5.72%)"
  test:
    start_year: 2015
    end_year: 2017
    description: "Final holdout benchmark (3 years, 10,828 records, 5.46%) - NEVER touched during tuning"

leakage_prevention_rules:
  - "Target-based filtering or outlier trimming must only be applied to training data."
  - "All transformers (scalers, encoders, imputers) must be fit strictly on train partition."
  - "Feature selection fit step must occur strictly within training partition."
  - "Test partition is strictly evaluated once for final model reporting."
