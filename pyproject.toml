[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-yield-prediction"
version = "0.1.0"
description = "Research-oriented crop yield prediction and forecasting using historical Indian agricultural data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aryan Puranik", email = "aryanpuranik22@gmail.com" }
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.0",
    "joblib>=1.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0"
]
app = [
    "streamlit>=1.35.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
